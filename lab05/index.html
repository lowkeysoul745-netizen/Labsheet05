<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fibonacci Series</title>
</head>
<body>
    <script type="text/javascript">
        var fib1 =0, fib2=1, fib=0;
        var num = prompt("Enter a number: \n");
        if(num != null && num>0){
            document.write("<h1> the first "+ num + " numbers in fibonacci series</h1>");
            if(num ==1){
                document.writeln("<h2>"+ fib1 + "</h2>");
            }else if(num ==2){
                document.writeln("<h2>"+ fib1 +" "+fib2+ "</h2>");
            }else{
                document.write("<h2>"+ fib1 +" "+fib2+ " ");
                for(var i = 3; i<= num ; i++){
                    
                    fib = fib1+fib2;
                    document.write(fib+ " ");
                    fib1 = fib2;
                    fib2 = fib;
                }
                document.write("</h2>")
            }
        }
        else{
            document.writeln("<h1>Fibonacci cannot be calculated for null or negative numbers</h1>");
        }
    </script>
    
</body>
</html>
