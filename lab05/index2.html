<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Square of the number</title>
</head>
<body>
    <script type="text/javascript">
        var num = prompt("Enter a number: \n");
        document.writeln("<h1>Square of "+num+" is "+ num*num+"</h1>");
    </script>
    
</body>
</html>
